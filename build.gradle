plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        laminar {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "org.lwjgl:lwjgl:${project.lwjgl_version}"
    implementation "org.lwjgl:lwjgl-opencl:${project.lwjgl_version}"

    include "org.lwjgl:lwjgl:${project.lwjgl_version}"
    include group: "org.lwjgl", name: "lwjgl", version: project.lwjgl_version, classifier: "natives-windows"
    include group: "org.lwjgl", name: "lwjgl", version: project.lwjgl_version, classifier: "natives-linux"
    include "org.lwjgl:lwjgl-opencl:${project.lwjgl_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
